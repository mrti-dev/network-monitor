spring.application.name=network-monitor

# Server
server.port=8080

# MySQL Datasource
spring.datasource.url=jdbc:mysql://localhost:3306/network_monitor?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false

# Custom App configs
app.monitoring.ping-interval=15
app.monitoring.timeout-ms=2000
app.monitoring.latency-threshold=150
app.monitoring.retention-days=7

# Discovery resource limits
app.discovery.max-hosts-per-scan=254
app.discovery.max-concurrent-scans=3
app.discovery.probe-concurrency=32
app.discovery.scan-timeout-seconds=60
app.discovery.probe-timeout-ms=2000
app.discovery.arp-timeout-ms=1500

# Security: không lưu mật khẩu admin mặc định trong file này.
# Khởi tạo user qua data.sql hoặc migration script với BCrypt hash.
# Spring Security auto-config bị ghi đè bởi SecurityConfig.
