spring.datasource.url=jdbc:h2:mem:network_monitor_dev;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

app.discovery.max-hosts-per-scan=254
app.discovery.max-concurrent-scans=3
app.discovery.probe-concurrency=4
app.discovery.scan-timeout-seconds=10
app.discovery.probe-timeout-ms=500
app.discovery.arp-timeout-ms=500

app.monitoring.ping-interval=15
app.monitoring.timeout-ms=500
app.monitoring.latency-threshold=150
app.monitoring.retention-days=7
