<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đăng nhập NDMMS</title><link rel="stylesheet" th:href="@{/css/ndmms.css}"></head>
<body class="login-page">
  <div class="login-status">CỔNG ĐĂNG NHẬP HỆ THỐNG AN NINH MẠNG</div>
  <main class="login-card">
    <div class="login-logo"><span class="brand-mark">N//</span><h1>NDMMS</h1><p>Hệ thống giám sát và quản lý mạng tập trung</p></div>
    <div class="flash error" th:if="${param.error}">Tên đăng nhập hoặc mật khẩu không đúng.</div>
    <div class="flash" th:if="${param.registered != null or successMessage != null}" th:text="${successMessage != null ? successMessage : 'Đăng ký tài khoản thành công!'}"></div>
    <div class="flash" th:if="${param.logout}">Đã đăng xuất thành công.</div>
    <hr>
    <form th:action="@{/login}" method="post">
      <div class="field"><label for="username">Tài khoản hoặc Email</label><input class="form-control" id="username" name="username" autocomplete="username" placeholder="Tên đăng nhập" required autofocus></div>
      <div class="field" style="margin-top:18px"><label for="password">Mật khẩu truy cập</label><input class="form-control" id="password" type="password" name="password" autocomplete="current-password" placeholder="••••••••••••" required></div>
      <div class="field" style="margin-top:24px"><label>Vai trò vận hành</label><div class="role-switch"><div class="role-option active"><strong>Admin</strong><small>Quản trị viên — Toàn quyền quản lý hệ thống</small></div><div class="role-option"><strong>Viewer</strong><small>Người xem — Chỉ xem báo cáo và giám sát</small></div></div></div>
      <button class="btn btn-primary btn-block" type="submit">Đăng nhập hệ thống</button>
    </form>
    <div class="login-footer"><a th:href="@{/register}">Đăng ký tài khoản mới</a></div>
  </main>
</body></html>
