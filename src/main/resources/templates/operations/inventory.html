<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NDMMS · Thiết bị</title><link rel="stylesheet" th:href="@{/css/ndmms.css}"><script th:src="@{/js/ndmms.js}" defer></script></head><body><div class="app-shell">
<aside th:replace="~{fragments/shell :: sidebar('devices')}"></aside><main class="workspace"><header th:replace="~{fragments/shell :: top('INVENTORY / DEVICES','Quản lý danh sách thiết bị')}"></header>
<section class="panel"><div class="panel-title"><div class="toolbar"><input class="form-control" placeholder="Tìm kiếm thiết bị, IP..." data-filter-table="#inventoryTable"><select class="form-select"><option>Tất cả trạng thái</option><option>ONLINE</option><option>WARNING</option><option>OFFLINE</option></select></div><a class="btn btn-primary" th:href="@{/devices/new}">Thêm thiết bị</a></div>
<div class="table-wrap"><table class="data-table" id="inventoryTable"><thead><tr><th>Tên thiết bị / IP</th><th>Loại</th><th>MAC</th><th>Trạng thái</th><th>Vị trí</th><th>Thao tác</th></tr></thead><tbody>
<tr th:each="d : ${devicePage.content}"><td class="device-name"><strong th:text="${d.name}"></strong><small th:text="${d.ipAddress}"></small></td><td th:text="${d.deviceType}"></td><td class="mono muted" th:text="${d.macAddress ?: '-'}"></td><td><span class="badge" th:classappend="${d.status}" th:text="${d.status}"></span></td><td th:text="${d.location ?: '-'}"></td><td><div class="toolbar"><a class="btn" th:href="@{/devices/metrics/{id}(id=${d.id})}">Theo dõi</a><a class="btn" th:href="@{/devices/edit/{id}(id=${d.id})}">Sửa</a></div></td></tr>
<tr th:if="${#lists.isEmpty(devicePage.content)}"><td colspan="6"><div class="empty">Chưa có thiết bị trong hệ thống.</div></td></tr></tbody></table></div></section><footer th:replace="~{fragments/shell :: footer}"></footer></main></div></body></html>
