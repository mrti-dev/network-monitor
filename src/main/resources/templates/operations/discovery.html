<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NDMMS · Auto-Discovery</title><link rel="stylesheet" th:href="@{/css/ndmms.css}"><script th:src="@{/js/ndmms.js}" defer></script></head><body><div class="app-shell">
<aside th:replace="~{fragments/shell :: sidebar('discovery')}"></aside><main class="workspace"><header th:replace="~{fragments/shell :: top('DISCOVERY / QUÉT MẠNG','Tự động phát hiện thiết bị')}"></header>
<section class="grid discovery-grid"><div class="grid"><article class="panel"><div class="panel-title"><h2>Cấu hình dải quét IP</h2><small>CIDR / RANGE</small></div><div class="field"><label for="scanSubnet">Dải IP cần quét (để trống để tự nhận)</label><input class="form-control mono" id="scanSubnet" placeholder="Ví dụ: 192.168.1.0/24"></div><button class="btn btn-primary btn-block" id="scanBtn" style="margin-top:16px">Kích hoạt quét toàn mạng</button></article><article class="panel"><div class="panel-title"><h2>Phiên quét hiện tại</h2><small id="scanPercent">SẴN SÀNG</small></div><p class="muted" id="scanMessage">Hệ thống sẽ tự chọn card mạng vật lý phù hợp.</p></article></div>
<div class="grid"><article class="panel"><div class="panel-title"><h2>Trạng thái tiến trình quét</h2><small>LIVE DISCOVERY</small></div><div class="chart scan-map"><div class="scan-nodes"><div class="scan-node"><i></i>Router / Gateway</div><div class="scan-node warn"><i></i>Switch</div><div class="scan-node"><i></i>Access Point</div><div class="scan-node down"><i></i>Server</div></div></div></article><article class="panel"><div class="panel-title"><h2>Thiết bị đã phát hiện</h2><span th:text="${devicePage.totalElements + ' thiết bị'}"></span></div><div class="table-wrap"><table class="data-table"><thead><tr><th>IP / Hostname</th><th>Địa chỉ MAC</th><th>Loại</th><th>Trạng thái</th></tr></thead><tbody><tr th:each="d : ${devicePage.content}"><td class="device-name"><strong th:text="${d.ipAddress}"></strong><small th:text="${d.name}"></small></td><td class="mono" th:text="${d.macAddress ?: '-'}"></td><td th:text="${d.deviceType}"></td><td><span class="badge" th:classappend="${d.status}" th:text="${d.status}"></span></td></tr><tr th:if="${#lists.isEmpty(devicePage.content)}"><td colspan="4"><div class="empty">Chưa phát hiện thiết bị.</div></td></tr></tbody></table></div></article></div></section><footer th:replace="~{fragments/shell :: footer}"></footer></main></div>
<script>const csrf=()=>decodeURIComponent((document.cookie.match(/(?:^|; )XSRF-TOKEN=([^;]*)/)||[])[1]||"");document.getElementById('scanBtn').onclick=async function(){this.disabled=true;scanPercent.textContent='ĐANG QUÉT';scanMessage.textContent='Đang thăm dò ICMP/ARP trên mạng cục bộ...';try{const subnet=scanSubnet.value.trim(),r=await fetch('/api/discovery/scan',{method:'POST',headers:{'Content-Type':'application/json','X-XSRF-TOKEN':csrf()},body:JSON.stringify(subnet?{subnet}:{})}),j=await r.json();if(!r.ok)throw new Error(j.message||j.error||'Quét thất bại');scanPercent.textContent='100% HOÀN THÀNH';scanMessage.textContent=`Phát hiện ${j.data.discovered}, thêm mới ${j.data.added}, bỏ qua ${j.data.skipped}.`;setTimeout(()=>location.reload(),1100)}catch(e){scanPercent.textContent='LỖI';scanMessage.textContent=e.message}finally{this.disabled=false}};</script></body></html>
