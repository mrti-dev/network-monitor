<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách Cảnh báo</title>
    <!-- Tabler Core -->
    <link rel="stylesheet" th:href="@{/dist/css/tabler.min.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script th:src="@{/dist/js/tabler.min.js}" defer></script>
</head>
<body class="layout-fluid">
    <div class="page">
        <!-- Navbar -->
        <header class="navbar navbar-expand-md d-print-none" data-bs-theme="dark">
            <div class="container-xl">
                <h1 class="navbar-brand navbar-brand-autodark d-none-navbar-horizontal pe-0 pe-md-3">
                    <a href="/devices" class="text-decoration-none">
                        <i class="bi bi-hdd-network"></i> Hệ thống Quản lý và Giám sát Thiết bị Mạng
                    </a>
                </h1>
                <div class="navbar-nav flex-row order-md-last">
                    <div class="nav-item">
                        <a href="/devices" class="nav-link"><span class="nav-link-title">Thiết bị</span></a>
                    </div>
                    <div class="nav-item active">
                        <a href="/alerts" class="nav-link"><span class="nav-link-title">Cảnh báo</span></a>
                    </div>
                </div>
            </div>
        </header>

        <div class="page-wrapper">
            <!-- Page header -->
            <div class="page-header d-print-none">
                <div class="container-xl">
                    <div class="row g-2 align-items-center">
                        <div class="col">
                            <h2 class="page-title text-danger"><i class="bi bi-bell-fill me-2"></i> Lịch sử Cảnh báo sự cố</h2>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Page body -->
            <div class="page-body">
                <div class="container-xl">
                    <div class="card">
                        <div class="table-responsive">
                            <table class="table table-vcenter card-table table-striped">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Thiết bị</th>
                                        <th>Loại cảnh báo</th>
                                        <th>Mức độ</th>
                                        <th>Trạng thái</th>
                                        <th>Nội dung chi tiết</th>
                                        <th>Thời gian kích hoạt</th>
                                        <th>Thời gian xử lý</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="alert : ${alerts}">
                                        <td class="text-secondary" th:text="${alert.id}"></td>
                                        <td class="fw-bold">
                                            <a th:href="@{/devices/metrics/{id}(id=${alert.device.id})}" th:text="${alert.device.name}"></a>
                                        </td>
                                        <td class="text-secondary" th:text="${alert.alertType}"></td>
                                        <td>
                                            <span class="badge bg-red-lt" th:if="${alert.severity?.name() == 'CRITICAL'}">CRITICAL</span>
                                            <span class="badge bg-orange-lt" th:if="${alert.severity?.name() == 'WARNING'}">WARNING</span>
                                            <span class="badge bg-blue-lt" th:if="${alert.severity?.name() == 'INFO'}">INFO</span>
                                        </td>
                                        <td>
                                            <span class="badge bg-red" th:if="${alert.status?.name() == 'TRIGGERED'}">TRIGGERED</span>
                                            <span class="badge bg-yellow" th:if="${alert.status?.name() == 'ACKNOWLEDGED'}">ACKNOWLEDGED</span>
                                            <span class="badge bg-green" th:if="${alert.status?.name() == 'RESOLVED'}">RESOLVED</span>
                                        </td>
                                        <td class="text-secondary" th:text="${alert.message}"></td>
                                        <td class="text-secondary" th:text="${#temporals.format(alert.triggeredAt, 'dd/MM/yyyy HH:mm:ss')}"></td>
                                        <td class="text-secondary" th:text="${alert.resolvedAt != null ? #temporals.format(alert.resolvedAt, 'dd/MM/yyyy HH:mm:ss') : '-'}"></td>
                                    </tr>
                                    <tr th:if="${#lists.isEmpty(alerts)}">
                                        <td colspan="8" class="text-center py-4 text-secondary">Chưa có cảnh báo nào trong hệ thống.</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
