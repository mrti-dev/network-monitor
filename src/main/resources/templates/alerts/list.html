<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NDMMS · Cảnh báo</title><link rel="stylesheet" th:href="@{/css/ndmms.css}"><script th:src="@{/js/ndmms.js}" defer></script></head><body><div class="app-shell"><aside th:replace="~{fragments/shell :: sidebar('alerts')}"></aside><main class="workspace"><header th:replace="~{fragments/shell :: top('GIÁM SÁT CẢNH BÁO / ALERTS','Trung tâm quản lý sự cố & cảnh báo')}"></header>
<section class="grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:18px"><article class="panel kpi danger"><span class="label">Nghiêm trọng</span><strong th:text="${#lists.size(alertPage.content.?[severity != null and severity.name() == 'CRITICAL'])}">0</strong><small>sự cố</small></article><article class="panel kpi"><span class="label">Cảnh báo</span><strong class="WARNING" th:text="${#lists.size(alertPage.content.?[severity != null and severity.name() == 'WARNING'])}">0</strong><small>sự cố</small></article><article class="panel kpi"><span class="label">Thông tin</span><strong class="INFO" th:text="${#lists.size(alertPage.content.?[severity != null and severity.name() == 'INFO'])}">0</strong><small>sự cố</small></article></section>
<section class="panel"><div class="panel-title"><div class="toolbar"><input class="form-control" placeholder="Tìm thiết bị, nội dung..." data-filter-table="#alertsTable"><select class="form-select"><option>Mức độ: Tất cả</option><option>CRITICAL</option><option>WARNING</option><option>INFO</option></select></div><span class="muted" th:text="${alertPage.totalElements + ' bản ghi'}"></span></div><div class="table-wrap"><table class="data-table" id="alertsTable"><thead><tr><th>Mức độ</th><th>Thiết bị / IP</th><th>Nội dung cảnh báo</th><th>Thời gian</th><th>Trạng thái</th></tr></thead><tbody>
<tr th:each="a : ${alertPage.content}"><td><span class="badge" th:classappend="${a.severity}" th:text="${a.severity}"></span></td><td class="device-name"><strong th:text="${a.deviceName}"></strong><small th:text="${a.isDeviceDeleted ? 'Thiết bị đã xóa' : 'Đang quản lý'}"></small></td><td th:text="${a.message}"></td><td class="mono muted" th:text="${#temporals.format(a.triggeredAt,'dd/MM/yyyy HH:mm:ss')}"></td><td><span class="badge" th:classappend="${a.status}" th:text="${a.status}"></span></td></tr><tr th:if="${#lists.isEmpty(alertPage.content)}"><td colspan="5"><div class="empty">Chưa có cảnh báo nào trong hệ thống.</div></td></tr>
</tbody></table></div><div class="pagination-bar"><span>Hiển thị <span th:text="${alertPage.totalElements == 0 ? 0 : alertPage.number * alertPage.size + 1}">0</span> đến <span th:text="${alertPage.totalElements == 0 ? 0 : alertPage.number * alertPage.size + alertPage.numberOfElements}">0</span> của <span th:text="${alertPage.totalElements}">0</span> mục</span><nav class="pagination" th:if="${alertPage.totalPages > 1}"><a class="btn" th:if="${alertPage.hasPrevious()}" th:href="@{/alerts(page=${alertPage.number - 1},size=${alertPage.size})}">Trước</a><span th:text="${alertPage.number + 1} + ' / ' + ${alertPage.totalPages}"></span><a class="btn" th:if="${alertPage.hasNext()}" th:href="@{/alerts(page=${alertPage.number + 1},size=${alertPage.size})}">Sau</a></nav></div></section><footer th:replace="~{fragments/shell :: footer}"></footer></main></div></body></html>
