<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NDMMS · Metrics</title><link rel="stylesheet" th:href="@{/css/ndmms.css}"><script th:src="@{/dist/js/apexcharts.min.js}" defer></script></head><body><div class="app-shell"><aside th:replace="~{fragments/shell :: sidebar('devices')}"></aside><main class="workspace"><header th:replace="~{fragments/shell :: top('MONITORING / DEVICE HEALTH','Giám sát sức khỏe thiết bị')}"></header>
<section class="grid kpi-grid"><article class="panel kpi"><span class="label">Thiết bị</span><strong style="font-size:19px" th:text="${device.name}"></strong><small th:text="${device.ipAddress}"></small></article><article class="panel kpi"><span class="label">Trạng thái</span><strong style="font-size:21px" th:text="${#lists.isEmpty(metrics) ? 'CHƯA CÓ DỮ LIỆU' : (metrics[metrics.size()-1].isReachable ? 'ONLINE' : 'OFFLINE')}"></strong><small>ICMP health check</small></article><article class="panel kpi"><span class="label">Ngưỡng độ trễ</span><strong th:text="${latencyThreshold + ' ms'}"></strong><small>Thiết lập cảnh báo</small></article><article class="panel kpi"><span class="label">Số mẫu</span><strong th:text="${#lists.size(metrics)}"></strong><small>Bản ghi gần đây</small></article></section>
<section class="panel"><div class="panel-title"><h2>Phân tích hiệu năng thời gian thực</h2><small>LATENCY / REACHABILITY</small></div><div id="metricChart" style="height:320px"></div></section><section class="panel" style="margin-top:18px"><div class="panel-title"><h2>Lịch sử kiểm tra kết nối</h2><a class="btn" th:href="@{/inventory}">Quay lại danh sách</a></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Thời gian</th><th>Trạng thái</th><th>Latency</th><th>Packet Loss</th></tr></thead><tbody><tr th:each="m : ${metrics}"><td class="mono muted" th:text="${#temporals.format(m.recordedAt,'dd/MM/yyyy HH:mm:ss')}"></td><td><span class="badge" th:classappend="${m.isReachable ? 'ONLINE' : 'OFFLINE'}" th:text="${m.isReachable ? 'ONLINE' : 'Thất bại (Timeout)'}"></span></td><td class="mono" th:text="${m.latencyMs != null ? m.latencyMs + ' ms' : '-'}"></td><td class="mono" th:text="${m.packetLoss != null ? m.packetLoss + '%' : '-'}"></td></tr><tr th:if="${#lists.isEmpty(metrics)}"><td colspan="4"><div class="empty">Chưa có dữ liệu giám sát.</div></td></tr></tbody></table></div></section><footer th:replace="~{fragments/shell :: footer}"></footer></main></div>
<script th:inline="javascript">document.addEventListener('DOMContentLoaded',()=>{const ms=/*[[${metrics}]]*/[];const chart=new ApexCharts(document.querySelector('#metricChart'),{chart:{type:'line',height:320,background:'transparent',toolbar:{show:false}},theme:{mode:'dark'},series:[{name:'Latency (ms)',data:ms.map(m=>m.isReachable ? m.latencyMs : null)}],xaxis:{categories:ms.map(m=>new Date(m.recordedAt).toLocaleTimeString('vi-VN'))},stroke:{curve:'straight',width:2},colors:['#27d8cb'],grid:{borderColor:'#17363d'},annotations:{yaxis:[{y: /*[[${latencyThreshold}]]*/ 150,borderColor:'#ff5268',label:{text:'Ngưỡng'}}]}});chart.render()});</script></body></html>
