<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${deviceForm.id == null ? 'Thêm thiết bị mới' : 'Cập nhật thiết bị'}"></title>
    <!-- Tabler Core -->
    <link rel="stylesheet" th:href="@{/dist/css/tabler.min.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script th:src="@{/dist/js/tabler.min.js}" defer></script>
</head>
<body class="layout-fluid">
    <div class="page">
        <!-- Navbar -->
        <header class="navbar navbar-expand-md d-print-none" data-bs-theme="dark">
            <div class="container-xl">
                <h1 class="navbar-brand navbar-brand-autodark d-none-navbar-horizontal pe-0 pe-md-3">
                    <a href="/devices" class="text-decoration-none">
                        <i class="bi bi-hdd-network"></i> Hệ thống Quản lý và Giám sát Thiết bị Mạng
                    </a>
                </h1>
                <div class="navbar-nav flex-row order-md-last">
                    <div class="nav-item active">
                        <a href="/devices" class="nav-link"><span class="nav-link-title">Thiết bị</span></a>
                    </div>
                    <div class="nav-item">
                        <a href="/alerts" class="nav-link"><span class="nav-link-title">Cảnh báo</span></a>
                    </div>
                </div>
            </div>
        </header>

        <div class="page-wrapper">
            <!-- Page header -->
            <div class="page-header d-print-none">
                <div class="container-xl">
                    <div class="row g-2 align-items-center">
                        <div class="col">
                            <div class="page-pretitle">Thiết bị</div>
                            <h2 class="page-title text-primary" th:text="${deviceForm.id == null ? 'Thêm thiết bị mới' : 'Cập nhật thiết bị'}"></h2>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Page body -->
            <div class="page-body">
                <div class="container-xl">
                    <div class="row justify-content-center">
                        <div class="col-md-8">
                            <form th:action="@{/devices/save}" th:object="${deviceForm}" method="post" class="card">
                                <div class="card-header">
                                    <h3 class="card-title">Thông tin chi tiết</h3>
                                </div>
                                <div class="card-body">
                                    
                                    <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
                                        <div class="d-flex">
                                            <div><i class="bi bi-exclamation-triangle me-2"></i></div>
                                            <div th:text="${errorMessage}"></div>
                                        </div>
                                    </div>

                                    <input type="hidden" th:field="*{id}" />

                                    <div class="mb-3">
                                        <label class="form-label required">Tên thiết bị</label>
                                        <input type="text" class="form-control" th:field="*{name}" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''">
                                        <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                                    </div>

                                    <div class="row">
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label required">IP Address</label>
                                            <input type="text" class="form-control" th:field="*{ipAddress}" placeholder="192.168.1.1" th:classappend="${#fields.hasErrors('ipAddress')} ? 'is-invalid' : ''">
                                            <div class="invalid-feedback" th:if="${#fields.hasErrors('ipAddress')}" th:errors="*{ipAddress}"></div>
                                        </div>

                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">MAC Address</label>
                                            <input type="text" class="form-control" th:field="*{macAddress}" placeholder="00:1A:2B:3C:4D:5E" th:classappend="${#fields.hasErrors('macAddress')} ? 'is-invalid' : ''">
                                            <div class="invalid-feedback" th:if="${#fields.hasErrors('macAddress')}" th:errors="*{macAddress}"></div>
                                        </div>
                                    </div>

                                    <div class="mb-3">
                                        <label class="form-label">Loại thiết bị</label>
                                        <select class="form-select" th:field="*{deviceType}">
                                            <option th:each="type : ${deviceTypes}" th:value="${type}" th:text="${type}"></option>
                                        </select>
                                    </div>

                                    <div class="mb-3">
                                        <label class="form-label">Vị trí</label>
                                        <input type="text" class="form-control" th:field="*{location}" placeholder="Tầng 1 - Phòng IT">
                                    </div>

                                    <h3 class="card-title mt-4 mb-3">Cấu hình đo riêng</h3>
                                    <div class="row">
                                        <div class="col-md-4 mb-3">
                                            <label class="form-label required">Chu kỳ đo (giây)</label>
                                            <input type="number" min="1" max="86400" class="form-control" th:field="*{pingInterval}" th:classappend="${#fields.hasErrors('pingInterval')} ? 'is-invalid' : ''">
                                            <div class="invalid-feedback" th:if="${#fields.hasErrors('pingInterval')}" th:errors="*{pingInterval}"></div>
                                        </div>
                                        <div class="col-md-4 mb-3">
                                            <label class="form-label required">Timeout (ms)</label>
                                            <input type="number" min="1" max="60000" class="form-control" th:field="*{timeoutMs}" th:classappend="${#fields.hasErrors('timeoutMs')} ? 'is-invalid' : ''">
                                            <div class="invalid-feedback" th:if="${#fields.hasErrors('timeoutMs')}" th:errors="*{timeoutMs}"></div>
                                        </div>
                                        <div class="col-md-4 mb-3">
                                            <label class="form-label required">Ngưỡng độ trễ (ms)</label>
                                            <input type="number" min="1" max="60000" step="0.1" class="form-control" th:field="*{latencyThreshold}" th:classappend="${#fields.hasErrors('latencyThreshold')} ? 'is-invalid' : ''">
                                            <div class="invalid-feedback" th:if="${#fields.hasErrors('latencyThreshold')}" th:errors="*{latencyThreshold}"></div>
                                        </div>
                                    </div>
                                </div>
                                <div class="card-footer text-end">
                                    <div class="d-flex justify-content-end gap-2">
                                        <a href="/devices" class="btn btn-link link-secondary">Hủy bỏ</a>
                                        <button type="submit" class="btn btn-primary">
                                            <i class="bi bi-save me-2"></i> Lưu thiết bị
                                        </button>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
