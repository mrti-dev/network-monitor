spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Discovery limits for tests
app.discovery.max-hosts-per-scan=254
app.discovery.max-concurrent-scans=3
app.discovery.probe-concurrency=4
app.discovery.scan-timeout-seconds=10
app.discovery.probe-timeout-ms=500
app.discovery.arp-timeout-ms=500
