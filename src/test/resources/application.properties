spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=false

DB_URL=jdbc:mysql://localhost:3306/network_monitor_test_local?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
DB_USERNAME=root
DB_PASSWORD=123456


# Discovery limits for tests
app.discovery.max-hosts-per-scan=254
app.discovery.max-concurrent-scans=3
app.discovery.probe-concurrency=4
app.discovery.scan-timeout-seconds=10
app.discovery.probe-timeout-ms=500
app.discovery.arp-timeout-ms=500

# Monitoring defaults
app.monitoring.ping-interval=15
app.monitoring.timeout-ms=500
app.monitoring.latency-threshold=150
app.monitoring.retention-days=7

# SNMP config for tests
app.snmp.timeout-ms=500
app.snmp.retries=1
app.snmp.polling-interval=60
app.snmp.max-concurrency=5
app.snmp.encryption-key=SecureTestEncryptionKey32CharsLong!

